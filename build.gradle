    from(layout.buildDirectory.dir('reports/cyclonedx')) {
        include 'jvm-sbom.json', 'application-sbom.json'
    }
    into("${projectDir}/src/main/resources")
    outputs.upToDateWhen { false } // 캐시 무효화 (필요 시)
}

// META-INF/sbom/ 등의 불필요 경로 제거
tasks.register('cleanSbomPaths', Delete) {
    description = '불필요한 SBOM 경로 제거'
    delete(
            layout.buildDirectory.dir("resources/main/META-INF/sbom/"),
            layout.buildDirectory.dir("BOOT-INF/classes/META-INF/sbom/"),
            layout.buildDirectory.file("resources/main/META-INF/sbom/application.cdx.json")
    )
}

// Gradle 빌드 과정에서 적용
tasks.named('processResources') {
    exclude '**/cyclonedx/sbom/**' // SBOM 파일 처리 배제
    dependsOn 'copySplitSboms'
    finalizedBy 'cleanSbomPaths' // 리소스 처리 후 불필요 파일 삭제
}

// JAR 빌드 시 중복 제거 보장
tasks.named('bootJar') {
