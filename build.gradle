// External Libraries Configuration
//tasks.register('copyExternalLibs', Copy) {
//    from configurations.runtimeClasspath
//    include 'spring-javaformat-config-*.jar'
//    include 'spring-javaformat-checkstyle-*.jar'
//    include 'spring-javaformat-intellij-idea-plugin-*.jar'
//    into project.file('3dparty')
//}
tasks.register('copyExternalLibs', Copy) {
    def targetDir = project.file('3dparty')

    // 찾을 jar 조건
    def jarsToCopy = configurations.runtimeClasspath.findAll {
        it.name.startsWith('spring-javaformat-') && it.name.endsWith('.jar')
    }

    if (!jarsToCopy) {
        println "No matching JARs found."
        return
    }

    // 모듈별 최신 jar만 유지
    def latestJarsMap = [:] // [moduleName: [version: '0.0.46', file: File]]

    jarsToCopy.each { file ->
        def matcher = (file.name =~ /^spring-javaformat-(.+)-(\d+\.\d+\.\d+.*)\.jar$/)
        if (matcher.matches()) {
            def module = matcher.group(1)
            def version = matcher.group(2)

            def current = latestJarsMap[module]
            if (!current || new ComparableVersion(version) > new ComparableVersion(current.version)) {
                latestJarsMap[module] = [version: version, file: file]
            }
        }
    }

    // 기존 폴더에 있는 구버전 삭제
    if (targetDir.exists()) {
        targetDir.listFiles()?.each { existing ->
            def matcher = (existing.name =~ /^spring-javaformat-(.+)-(\d+\.\d+\.\d+.*)\.jar$/)
            if (matcher.matches()) {
                def module = matcher.group(1)
                def version = matcher.group(2)

                def latest = latestJarsMap[module]
                if (latest && new ComparableVersion(version) < new ComparableVersion(latest.version)) {
                    println "Deleting older version: ${existing.name}"
                    existing.delete()
                }
            }
        }
    } else {
        targetDir.mkdirs()
    }

    // 최신 버전만 복사
    from latestJarsMap.values().collect { it.file }
    into targetDir
}

