tasks.register("generateMsgEnum") {
    // 소스 디렉터리 하위에 생성 (configuration phase 계산, configuration cache 호환)
    def generatedSrcDir = layout.projectDirectory.dir("src/main/java").asFile

    def propFile = layout.projectDirectory.file("src/main/resources/messages/message.properties").asFile
    def genPropsFile = layout.projectDirectory.file("src/main/resources/message-gen.properties").asFile

    dependsOn(tasks.named("copySplitSboms"))

    inputs.file(propFile)
    inputs.file(genPropsFile)
    outputs.dir(generatedSrcDir)

    doLast {
        if (!propFile.exists()) {
            throw new GradleException("메시지 파일이 존재하지 않습니다: $propFile")
        }

        def props = new Properties()
        propFile.withInputStream { props.load(it) }

        def genProps = new Properties()
        genPropsFile.withInputStream { genProps.load(it) }

        def packageName = genProps.getProperty("java.package")
        def enumName = genProps.getProperty("java.class")

        def packageDir = new File(generatedSrcDir, packageName.replace('.', '/'))
        packageDir.mkdirs()
        def enumFile = new File(packageDir, "${enumName}.java")

        enumFile.withWriter("UTF-8") { writer ->
            writer.println("package ${packageName};")
            writer.println("")
            writer.println("public enum ${enumName} {")
            writer.println("")

            props.keySet().eachWithIndex { key, idx ->
                def constName = key.toString().toUpperCase().replaceAll('[^A-Z0-9]', '_')
                writer.print("    ${constName}(\"$key\")")
                writer.println(idx < props.size() - 1 ? "," : ";")
            }

            writer.println()
            writer.println("    private final String key;")
            writer.println("    ${enumName}(String key){ this.key = key; }")
            writer.println("    public String key(){ return key; }")
            writer.println("    public String msg(){ return com.devkbil.mtssbj.common.MsgService.msg(this); }")
            writer.println()
            writer.println("    @Override")
            writer.println("    public String toString() {")
            writer.println("        return msg();")
            writer.println("    }")
            writer.println("}")
        }
    }
}

// compileJava에 의존 설정
tasks.named("compileJava") {
    dependsOn(tasks.named("generateMsgEnum"))
}
